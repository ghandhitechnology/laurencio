name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun test
      - run: bun run e2e:two-home
      - run: bun run e2e:server
      - if: runner.os == 'macOS'
        run: bun run cli:test

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            extension: ''
          - os: macos-15-intel
            target: bun-darwin-x64
            extension: ''
          - os: windows-latest
            target: bun-windows-x64
            extension: '.exe'
          - os: windows-11-arm
            target: bun-windows-arm64
            extension: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=${{ matrix.target }} --outfile laurencio-${{ matrix.target }}${{ matrix.extension }} packages/cli/src/index.ts
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --sign - --identifier com.ghandhitechnology.laurencio laurencio-${{ matrix.target }}
      - run: ./laurencio-${{ matrix.target }}${{ matrix.extension }} --version
      - name: Check Windows Credential Manager and bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          bun test packages/core/test/windows-credentials.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test packages/core/test/paths.test.ts packages/core/test/lock-race.test.ts packages/cli/test/workbench-runtime.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test packages/cli/test/daemon-install.test.ts -t Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process pwsh.exe -ArgumentList '-NoProfile','-NonInteractive','-Command','exit 23' -PassThru -Wait
          if ($process.ExitCode -ne 23) { throw "PowerShell lifecycle returned $($process.ExitCode)" }
          bun build --compile --outfile windows-credential-check.exe scripts/windows-credential-check.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./windows-credential-check.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: laurencio-${{ matrix.target }}
          path: laurencio-${{ matrix.target }}${{ matrix.extension }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: laurencio-*
          merge-multiple: true
      - name: Create checksums
        run: |
          for binary in laurencio-bun-*; do
            sha256sum "$binary" > "$binary.sha256"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" laurencio-bun-* --generate-notes --verify-tag --repo "${GITHUB_REPOSITORY}"
