name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun test
      - run: bun run e2e:two-home
      - run: bun run e2e:server

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=${{ matrix.target }} --outfile laurencio-${{ matrix.target }} packages/cli/src/index.ts
      - name: Sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --sign - --identifier com.ghandhitechnology.laurencio laurencio-${{ matrix.target }}
      - run: ./laurencio-${{ matrix.target }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: laurencio-${{ matrix.target }}
          path: laurencio-${{ matrix.target }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: laurencio-*
          merge-multiple: true
      - name: Create checksums
        run: |
          for binary in laurencio-bun-*; do
            sha256sum "$binary" > "$binary.sha256"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" laurencio-bun-* --generate-notes --verify-tag --repo "${GITHUB_REPOSITORY}"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/cli
      - run: bun publish --access public
        working-directory: packages/cli
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
